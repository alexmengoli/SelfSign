<header class="app-header">
  <div class="brand">
    <img class="brand-symbol" src="branding/selfsign-logo.svg" alt="" width="32" height="32" />
    <img class="brand-logo brand-logo-light" src="branding/selfsign-logotype-light.svg" alt="SelfSign" width="100" height="35" />
    <img class="brand-logo brand-logo-dark" src="branding/selfsign-logotype-dark.svg" alt="SelfSign" width="100" height="35" />
  </div>
  <span class="spacer"></span>
  <app-theme-toggle />
</header>

<div class="app-body" [class.mobile]="layout.isMobile()">
  <main
    #documentList="cdkDropList"
    id="document-drop-list"
    class="app-document"
    cdkDropList
    (cdkDropListEntered)="viewer.dragEntered()"
    (cdkDropListExited)="viewer.dragExited()"
    (cdkDropListDropped)="viewer.dropPlacement($event)"
  >
    <app-pdf-viewer #viewer />
  </main>
  @if (!layout.isMobile()) {
    <aside
      class="app-sidebar"
      aria-label="Fields"
      cdkDropList
      [cdkDropListConnectedTo]="[documentList]"
      [cdkDropListSortingDisabled]="true"
    >
      <app-sidebar />
    </aside>
  }
</div>

@if (layout.isMobile()) {
  <button
    #fieldsFab
    matFab
    type="button"
    class="fields-fab"
    [class.fields-fab-sheet-active]="fieldsOpen()"
    aria-label="Fields"
    aria-haspopup="dialog"
    [attr.aria-expanded]="fieldsOpen()"
    matTooltip="Fields"
    (click)="openFields()"
  >
    <mat-icon svgIcon="fields" />
  </button>
}
